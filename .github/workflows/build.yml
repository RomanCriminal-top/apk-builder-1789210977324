name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK bits
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Build APK
        run: |
          PKG=com.appbuilder.webapp
          APP=$(cat appname.txt)
          mkdir -p res/mipmap assets src/$PKG
          cp index.html assets/
          cp icon.png res/mipmap/ic_launcher.png

          cat > AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PKG" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/>
            <application android:label="$APP" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > src/$PKG/MainActivity.java <<EOF
          package $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              WebView w = new WebView(this);
              WebSettings ws = w.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          EOF

          API=$ANDROID_HOME/platforms/android-33/android.jar
          aapt2 compile --dir res -o res.zip
          aapt2 link -o app.apk -I $API --manifest AndroidManifest.xml -R res.zip --java src --auto-add-overlay
          javac -source 1.8 -target 1.8 -bootclasspath $API -d classes src/$PKG/*.java
          d8 --output . --lib $API classes/$PKG/*.class
          zip -uj app.apk classes.dex
          keytool -genkeypair -keystore k.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=App"
          zipalign -f 4 app.apk app-aligned.apk
          apksigner sign --ks k.jks --ks-pass pass:123456 --out app-signed.apk app-aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Сборка ${{ github.run_number }}"
          files: app-signed.apk